<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bạn Đồng Ý Làm Người Yêu Mình Nhaaa!!!</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <style>
        /* Custom CSS for animations */
        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
        @keyframes pulse-success {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }
        @keyframes gift-pop {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(-10deg);
                opacity: 0;
            }
            60% {
                transform: translateY(-20px) scale(1.05) rotate(5deg);
                opacity: 1;
            }
            100% {
                transform: translateY(0) scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        @keyframes gift-open {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1) rotate(5deg);
            }
            100% {
                transform: scale(0.9) rotate(0deg);
                opacity: 0.5;
            }
        }
        @keyframes balloon-fly {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(0.5);
                opacity: 0;
            }
        }
        @keyframes bubble-appear {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes button-pop {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }
        .falling {
            animation: fall linear infinite;
            position: absolute;
            font-size: 2rem;
            pointer-events: none;
        }
        .balloon {
            animation: balloon-fly 3s ease-out forwards;
            position: absolute;
            font-size: 2rem;
            pointer-events: none;
        }
        .success-message {
            animation: pulse-success 2s ease-in-out infinite;
        }
        .button-pop {
            animation: button-pop 0.5s ease-out forwards;
        }
        #fall-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        #proposal-box {
            position: relative;
            z-index: 10;
            max-width: 400px;
            padding: 2rem;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: 2px solid #f472b6;
        }
        #yes-btn {
            background: linear-gradient(45deg, #22c55e, #16a34a); /* Green for YES */
            color: white;
            font-weight: bold;
            transition: transform 0.2s;
        }
        #yes-btn:hover {
            transform: scale(1.1);
        }
        #no-btn {
            background: #ef4444; /* Red for NO */
            color: white;
            font-weight: bold;
            transition: transform 0.2s;
        }
        #no-btn:hover {
            transform: scale(1.05);
        }
        #success-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #gift-box {
            background: linear-gradient(45deg, #fbbf24, #f59e0b); /* Golden gift box */
            border: 4px solid #d97706;
            border-radius: 1rem;
            padding: 2rem;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: gift-pop 1s ease-out forwards;
            transform-origin: bottom;
            position: relative;
        }
        #gift-box::before {
            content: '🎀'; /* Bow */
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
        }
        #gift-box::after {
            content: '🎁'; /* Ribbon or gift */
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
        }
        #no-bubble {
            position: absolute;
            background: white;
            border: 2px solid #ef4444;
            border-radius: 1rem;
            padding: 0.5rem 1rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-weight: bold;
            color: #ef4444;
            display: none;
            animation: bubble-appear 0.5s ease-out forwards;
            z-index: 15;
        }
        #no-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid white;
        }
    </style>
</head>
<body class="bg-pink-100 min-h-screen flex items-center justify-center relative overflow-hidden" style="font-family: 'Inter', sans-serif;">
    <!-- Falling Elements Container -->
    <div id="fall-container"></div>

    <!-- Proposal Box -->
    <div id="proposal-box" class="text-center shadow-2xl rounded-3xl">
        <h1 class="text-2xl md:text-3xl font-bold text-pink-600 mb-4">Một Điều Quan Trọng...</h1>
        <p class="text-lg md:text-xl text-gray-700 mb-6">Bạn đồng ý làm người yêu mình nhaaa!!! 💕</p>
        <div class="flex justify-center space-x-4 relative">
            <button id="yes-btn" class="px-8 py-4 rounded-full shadow-lg">CÓ</button>
            <button id="no-btn" class="px-8 py-4 rounded-full shadow-lg">KHÔNG</button>
            <div id="no-bubble">Không thể từ chối! 😘</div>
        </div>
    </div>

    <!-- Success View -->
    <div id="success-view">
        <div id="gift-box">
            <h2 class="text-2xl md:text-3xl font-bold text-red-500 success-message mb-4">mình cũng yêu bạn!, mình sẵn sàng để bên cạnh bạn và yêu thương bạn mãi mãi ạaaa!! ❤️</h2>
        </div>
    </div>

    <script>
        // Initialize variables
        const fallContainer = document.getElementById('fall-container');
        const proposalBox = document.getElementById('proposal-box');
        const successView = document.getElementById('success-view');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const noBubble = document.getElementById('no-bubble');
        const giftBox = document.getElementById('gift-box');
        let noClickCount = 0;

        // Icons for falling: flowers, hearts, pandas
        const icons = ['🌸', '🌷', '💖', '🐼'];

        // Create falling element (falls forever)
        function createFallingElement(icon, speed, size) {
            const element = document.createElement('div');
            element.classList.add('falling');
            element.textContent = icon;
            element.style.left = Math.random() * 100 + '%';
            element.style.animationDuration = speed + 's';
            element.style.fontSize = size + 'rem';
            fallContainer.appendChild(element);
            // No removal, falls forever
        }

        // Start initial falling (continuous)
        setInterval(() => {
            if (fallContainer.children.length < 30) {
                const icon = icons[Math.floor(Math.random() * icons.length)];
                const speed = Math.random() * 3 + 2; // 2-5s
                const size = Math.random() * 0.5 + 1.5; // 1.5-2rem
                createFallingElement(icon, speed, size);
            }
        }, 500); // Add new every 0.5s to maintain ~30

        // NO button logic
        function moveNoButtonRandomly() {
            const boxRect = proposalBox.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();
            const maxX = boxRect.width - btnRect.width;
            const maxY = boxRect.height - btnRect.height;
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
            noBtn.style.position = 'absolute';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
            noClickCount++;
            if (noClickCount >= 5) {
                // Add pop animation
                noBtn.classList.add('button-pop');
                setTimeout(() => {
                    noBtn.style.opacity = '0';
                    noBtn.style.pointerEvents = 'none';
                    // Show bubble
                    noBubble.style.display = 'block';
                    noBubble.style.left = newX + 'px';
                    noBubble.style.top = (newY - 50) + 'px'; // Above button
                }, 500); // After animation
            }
        }

        noBtn.addEventListener('mouseover', moveNoButtonRandomly);
        noBtn.addEventListener('focus', moveNoButtonRandomly);
        noBtn.addEventListener('click', moveNoButtonRandomly);

        // YES button logic
        yesBtn.addEventListener('click', async () => {
            proposalBox.style.display = 'none';
            successView.style.display = 'flex';

            // Trigger gift box animation
            giftBox.style.animation = 'none'; // Reset
            setTimeout(() => {
                giftBox.style.animation = 'gift-pop 1s ease-out forwards';
            }, 100);

            // After pop, open the box and release balloons
            setTimeout(() => {
                giftBox.style.animation = 'gift-open 1s ease-out forwards';
                releaseBalloons();
            }, 1500); // After 1.5s pop

            // Start Tone.js and play success chime
            await Tone.start();
            playSuccessChime();

            // Start mass falling (additional hearts/tulips/pandas, continuous)
            startMassFalling();
        });

        // Release balloons when gift opens
        function releaseBalloons() {
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const balloon = document.createElement('div');
                    balloon.classList.add('balloon');
                    balloon.textContent = '🎈';
                    balloon.style.left = (20 + Math.random() * 60) + '%'; // Center area
                    balloon.style.bottom = '20%';
                    successView.appendChild(balloon);
                    setTimeout(() => balloon.remove(), 3000);
                }, i * 200); // Staggered
            }
        }

        // Play success chime using Tone.js (Arpeggio C Major)
        function playSuccessChime() {
            const synth = new Tone.PolySynth(Tone.Synth).toDestination();
            const notes = ['C4', 'E4', 'G4', 'C5', 'E5', 'G5', 'C6']; // Arpeggio C Major
            notes.forEach((note, index) => {
                synth.triggerAttackRelease(note, '8n', Tone.now() + index * 0.3);
            });
        }

        // Start mass falling (continuous)
        function startMassFalling() {
            setInterval(() => {
                const icon = icons[Math.floor(Math.random() * icons.length)]; // Include pandas
                const speed = Math.random() * 2 + 1; // 1-3s
                const size = Math.random() * 1 + 2; // 2-3rem
                createFallingElement(icon, speed, size);
            }, 100); // Add new every 0.1s for mass effect
        }
    </script>
</body>
</html>
